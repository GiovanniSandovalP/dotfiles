# ==========================================
# HYPRLAND - MINIMAL CONFIGURATION
# ==========================================

# --- MONITOR & KEYBOARD ---
monitor=,preferred,auto,1

input {
    kb_layout = us
    kb_variant = intl
}

# --- BASE STETIC AND TRANSPARENCY ---
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(00f0ffff) rgba(00f0ffff) rgba(00f0ffff) rgba(00f0ffff) rgba(00f0ffff) rgba(00f0ffff) rgba(00f0ffff) rgba(00f0ffff) rgba(ff00d4ff) rgba(ff00d4ff)
col.inactive_border = rgba(00f0ffaa) rgba(00f0ffaa) rgba(00f0ffaa) rgba(00f0ffaa) rgba(00f0ffaa) rgba(00f0ffaa) rgba(00f0ffaa) rgba(00f0ffaa) rgba(ff00d4aa) rgba(ff00d4aa)
}

decoration {
    rounding = 8
    active_opacity = 0.95
    inactive_opacity = 0.90
}

animations {
    enabled = yes
    bezier = linear, 0.0, 0.0, 1.0, 1.0
    animation = borderangle, 1, 150, linear, loop
}
    
# --- KEYBINDINGS ---
$mainMod = SUPER

# Launch applications
bind = $mainMod, Q, exec, kitty
bind = $mainMod, E, exec, dolphin
bind = $mainMod, R, exec, rofi -show drun
bind = $mainMod, B, exec, firefox

# Window management
bind = $mainMod, C, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, V, togglefloating,

# Move focus between windows (Arrow keys)
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# --- Volume Control (PipeWire / WirePlumber) ---
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl  = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# --- Screen Brightness Control ---
bindel = , XF86MonBrightnessUp, exec, brightnessctl set +5%
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# --- AUTOSTART ---
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = waybar
exec-once = hyprpaper -c ~/.config/hyprpaper/hyprpaper.conf

