# --- Tipografía Principal ---
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# --- Renderizado de Emojis ---
# Fuerza a Kitty a usar Noto Color Emoji para bloques Unicode de emojis
symbol_map U+1F300-U+1F9FF,U+1F600-U+1F64F,U+1F680-U+1F6FF,U+2600-U+26FF,U+2700-U+27BF Noto Color Emoji
